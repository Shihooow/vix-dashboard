name: probe-data-sources
on:
  push:
    branches: [claude/actions-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: raw HTTP status
        run: |
          for u in \
            https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv \
            https://cdn.cboe.com/api/global/us_indices/daily_prices/SKEW_History.csv \
            https://cdn-api.cboe.com/api/global/delayed_quotes/quotes/_VIX.json \
            https://cdn.cboe.com/data/us/futures/market_statistics/historical_data/VX/VX_2026-10-21.csv \
            "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=5d&interval=1d" \
            "https://query1.finance.yahoo.com/v8/finance/chart/200A.T?range=5d&interval=1d"; do
            code=$(curl -s -o /tmp/b -w '%{http_code}' -A "Mozilla/5.0 vix-dashboard" "$u"); echo "$code $(head -c 80 /tmp/b | tr '\n' ' ') <- $u"
          done
      - name: fetch_signals.py (full)
        run: python3 scripts/fetch_signals.py
      - name: markets
        run: |
          python3 -c "
          import sys,json; sys.path.insert(0,'scripts'); import fetch_markets as m
          d=m.build_markets(); print('errors:',d.get('errors')); print('crash:',d.get('crash_type'))"
      - name: summary
        run: python3 -c "import json;d=json.load(open('signals.json'));print(d['date'],d['latest_quote'],d['contango_12_pct'],len(d['history_tail']))"
