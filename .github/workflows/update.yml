# VIXダッシュボードの自動更新(2026-10-15〜、パソコン不要)
# 日本時間 7:50 / 18:50(月〜土)に Cboe・Yahoo からデータを取得して log.csv と画面を更新し、mainへコミットする。
# 朝は前日の米国終値(CSV未反映なら delayed_quotes)、夕方はCSVの確定値でシグナル・先物まで追いつかせる。
name: update-dashboard
on:
  schedule:
    - cron: "50 22 * * 0-5"   # JST 7:50 月〜土
    - cron: "50 9 * * 1-6"    # JST 18:50 月〜土
  workflow_dispatch: {}
  push:                        # スクリプトや設定を変えたときも1回動かして確認する
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"
permissions:
  contents: write
  pages: write
concurrency:
  group: update-dashboard
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: データ取得とダッシュボード再生成
        env:
          TZ: Asia/Tokyo
        run: |
          python3 scripts/fetch_signals.py
          python3 scripts/update_dashboard.py --from-signals
          cp dashboard.html index.html
          grep -q "地合いシグナル" dashboard.html
          grep -q "今日のアクション" dashboard.html
      - name: コミットして公開
        env:
          TZ: Asia/Tokyo
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "VIX Dashboard Bot"
          git config user.email "vix-dashboard-bot@users.noreply.github.com"
          git add -A index.html dashboard.html log.csv signals.json markets.json
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -q -m "update $(date +%F) $(date +%H:%M)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 10
          done
          # GITHUB_TOKEN でのpushはPagesの再ビルドを起こさないことがあるので明示的に依頼する
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || true
