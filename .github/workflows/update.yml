# VIXダッシュボードの自動更新(2026-10-15〜、パソコン不要。2026-10-20 朝に寄せて改訂)
# 主役は Claude のクラウドのスケジュールタスク(毎朝6:45、時刻どおりに動く)。こちらはその予備。
# GitHub の定時実行は混雑時に1〜3時間遅れることがある(10月の実績: 7:50指定 → 9:30〜9:50実行)ため、
# 早めの時刻に3回入れておき、どれか1回でも走れば最新になるようにしている。数値が変わらなければコミットしない。
name: update-dashboard
on:
  schedule:
    - cron: "23 21 * * 0-5"   # JST 6:23 月〜土
    - cron: "53 21 * * 0-5"   # JST 6:53 月〜土
    - cron: "23 22 * * 0-5"   # JST 7:23 月〜土
  workflow_dispatch: {}
  push:                        # スクリプトや設定を変えたときも1回動かして確認する
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"
permissions:
  contents: write
  pages: write
concurrency:
  group: update-dashboard
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: データ取得・再生成・公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/run_update.sh
